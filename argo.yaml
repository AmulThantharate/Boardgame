apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boardgame
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/AmulThantharate/Boardgame.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: boardgame

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
