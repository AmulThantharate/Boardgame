apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgmae
  namespace: boardgmae
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boardgmae
  template:
    metadata:
      labels:
        app: boardgmae
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: boardgmae
          image: claw4321/boardgame:v1
          imagePullPolicy: Always
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: boardgmae-service
  namespace: boardgmae
spec:
  selector:
    app: boardgmae
  ports:
    - port: 80
      targetPort: 8080
  type: NodePort
